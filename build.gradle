import dex.plugins.outlet.v2.util.ReleaseType
import groovy.text.SimpleTemplateEngine

plugins {
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'io.github.dexman545.outlet' version '1.6.1' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
    id 'xyz.jpenilla.run-velocity' version '3.0.2' apply false
}

def branchName = {
    def branch = System.getenv("BRANCH_NAME")
    if (!branch) {
        try {
            branch = ["git", "rev-parse", "--abbrev-ref", "HEAD"].execute().text.trim()
        } catch (ignored) {
            branch = "local"
        }
    }
    if (!branch || branch == "HEAD") branch = "local"
    return branch.replaceAll("[^a-zA-Z0-9._-]", "-")
}()

group = "live.qsmc.quipt"
version = "${project_version}-${build_status}.${build_number}" + (branchName == "master" || branchName == "origin" ? "" : "-${branchName}")

allprojects {
    group = "live.qsmc.quipt"
    version = "${project_version}-${build_status}.${build_number}" + (branchName == "master" || branchName == "origin" ? "" : "-${branchName}")

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://libraries.minecraft.net/" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'


    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        systemProperty 'net.bytebuddy.experimental', 'true'
    }




}

configure(subprojects.findAll { it.name == "common" ||  it.name == "velocity" ||  it.name == "paper" ||  it.name == "fabric" }) {
    version = "${project_version}-${build_status}.${build_number}" + (branchName == "master" || branchName == "origin" ? "" : "-${branchName}") + "-MC${minecraft_version}"
}


configure(subprojects.findAll { it.name == "paper" || it.name == "fabric" || it.name == "velocity" }) {
    apply plugin: 'com.modrinth.minotaur'
    apply plugin: 'io.github.dexman545.outlet'

    outlet {
        mcVersionRange = supported_minecraft_versions
        allowedReleaseTypes = Set.of(ReleaseType.RELEASE)
    }
    tasks.modrinth.dependsOn(tasks.modrinthSyncBody)

    tasks.modrinth.doLast {
        def uploadedVersion = tasks.modrinth.newVersion
        if (uploadedVersion != null) {
            def str = rootProject.file("changelog.md").text
            def max = 75

            def truncatedChangelog = (str?.size() > max) ? "${str.take(max - 13)}... [Read More](https://modrinth.com/plugin/$modrinth_id/changelog)" : str
            def modrinth_version = uploadedVersion.id

            logger.lifecycle("Modrinth returned version {} (ID: {})", uploadedVersion.versionNumber, uploadedVersion.id)
            String endpoint = "https://ptb.discord.com/api/webhooks/1562201958675255416/xeVJdJXOfsaKTQje1qMLRo6Yps5RHkWc65IzodxcRnGGsOEvXGYJB1E6yC3hj5IjfWSa"

            def binding = [
                    version: version,
                    modrinth_id: modrinth_id,
                    modrinth_version: modrinth_version,
                    truncatedChangelog: groovy.json.StringEscapeUtils.escapeJava(truncatedChangelog),
                    module: project.name
            ]
            def engine = new groovy.text.SimpleTemplateEngine()
            String payload = engine.createTemplate(rootProject.file("modrinth.json")).make(binding).toString()

            try {
                String response = postJson(endpoint, payload)
                println "Received: $response"
            } catch (Exception e) {
                println "Attempt failed: ${e.message}"
            }
        }
    }


}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.register("preparePublish") {
    group = "publishing"
    description = "Generates Maven metadata for all submodule publications."
    subprojects.each { sub ->
        String subProjectName = "${sub.name.charAt(0).toUpperCase()}${sub.name.substring(1).toLowerCase()}"
        dependsOn sub.tasks.matching { t ->
            t.name == "generateMetadataFileFor${subProjectName}Publication" ||
                    t.name == "generatePomFileFor${subProjectName}Publication"
        }
    }
}

def postJson(String url, String json) {
    HttpURLConnection conn = (HttpURLConnection) new URL(url).openConnection()
    conn.requestMethod = 'POST'
    conn.doOutput = true
    conn.setRequestProperty('Content-Type', 'application/json')
    conn.outputStream.withWriter('UTF-8') { it.write(json) }
    return conn.inputStream.text
}