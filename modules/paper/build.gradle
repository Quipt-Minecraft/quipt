plugins {
    id "com.gradleup.shadow"
    id "xyz.jpenilla.run-paper"
}

configurations {
    bundle
    implementation.extendsFrom(bundle)
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "mockbukkit-repo"
        url = "https://repo.mockbukkit.org/snapshots/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    testImplementation platform("org.junit:junit-bom:$junit_version")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockito_version"
    testImplementation "ch.qos.logback:logback-classic:$logback_version"

    testImplementation "io.papermc.paper:paper-api:${minecraft_version}.build.${paper_build_number}-${paper_build_channel}"

    compileOnly "io.papermc.paper:paper-api:${minecraft_version}.build.${paper_build_number}-${paper_build_channel}"
    implementation "org.json:json:$json_version"

    implementation "org.eclipse.jetty:jetty-server:$jetty_server_version"
    implementation "org.eclipse.jetty:jetty-servlet:$jetty_servlet_version"
    implementation "net.kyori:adventure-api:$adventure_api_version"

    bundle project(":modules:common")
    bundle project(":modules:core")
    bundle project(":modules:bot")
}

publishing {
    publications {
        create("paper", MavenPublication) {
            artifactId = project.name
            from components.shadow
        }
    }
}

shadowJar {
    configurations = [project.configurations.bundle]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    append 'META-INF/LICENSE'
    append 'META-INF/NOTICE'
}

tasks {
    runServer {
        minecraftVersion("${minecraft_version}")
    }
}

test {
    useJUnitPlatform()
    systemProperty 'net.bytebuddy.experimental', 'true'
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
    }
}

processResources {
    def pluginProperties = [minecraft_version: minecraft_version, author: author, name: rootProject.name, project_version: project_version]
    inputs.properties pluginProperties
    filteringCharset 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from(rootProject.file('gradle.properties'))

    filesMatching('paper-plugin.yml') {
        expand pluginProperties
    }
}


modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    changelog = System.getenv("CHANGELOG") ?: rootProject.file("changelog.md").text
    projectId = "${modrinth_id}"
    versionNumber = "${version}"
    versionType = "${build_status}"
    gameVersions = outlet.mcVersions()
    // Upload the final shaded (fat) jar which includes bundled modules
    uploadFile = shadowJar
    loaders = [project.name]
    syncBodyFrom = rootProject.file("readme.md").text
}

// Ensure the Modrinth upload runs after the shaded jar has been created
tasks.modrinth.dependsOn(shadowJar)

